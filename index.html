<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стоп на 5 секунд - Интерактив</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; user-select: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // Инициализация Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBkupYKG2kAP7hJpAS6VRJILTlP-NMEw3Q",
  authDomain: "stop-5-sec.firebaseapp.com",
  databaseURL: "https://stop-5-sec-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "stop-5-sec",
  storageBucket: "stop-5-sec.firebasestorage.app",
  messagingSenderId: "560034364856",
  appId: "1:560034364856:web:de8e13de7edf7c840ee34d"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // Компонент QR-кода
        const ReliableQRCode = ({ value, size = 180 }) => {
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(value)}`;
            return React.createElement('div', { className: 'bg-white p-3 rounded-3xl shadow-xl inline-block border-4 border-indigo-500' }, [
                React.createElement('img', { src: qrImageUrl, alt: 'QR', width: size, height: size, className: 'block rounded-xl' })
            ]);
        };

        function App() {
            const [view, setView] = React.useState('player');
            const [playerName, setPlayerName] = React.useState(localStorage.getItem('stop_game_name') || '');
            const [isRegistered, setIsRegistered] = React.useState(!!localStorage.getItem('stop_game_name'));
            
            // Настройки игры (из базы)
            const [targetTime, setTargetTime] = React.useState(5.0);
            const [maxAttempts, setMaxAttempts] = React.useState(3);
            const [blindMode, setBlindMode] = React.useState(false);
            const [gameStopped, setGameStopped] = React.useState(false);
            const [showPlayerLeaderboard, setShowPlayerLeaderboard] = React.useState(true);
            const [currentAppUrl] = React.useState(window.location.href);

            const [timerState, setTimerState] = React.useState('idle');
            const [startTime, setStartTime] = React.useState(null);
            const [elapsed, setElapsed] = React.useState(0);
            const [attemptsLeft, setAttemptsLeft] = React.useState(3);
            const [myResults, setMyResults] = React.useState([]);
            const [leaderboard, setLeaderboard] = React.useState([]);

            // Клик по логотипу открывает запрос PIN
            const handleLogoClick = () => {
                const pin = prompt('Введите PIN администратора:');
                if (pin === '1234') {
                    setView('admin');
                } else if (pin !== null) {
                    alert('Неверный PIN!');
                }
            };

            // Синхронизация с облаком
            React.useEffect(() => {
                const settingsRef = db.ref('settings');
                settingsRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        if (data.targetTime !== undefined) setTargetTime(data.targetTime);
                        if (data.maxAttempts !== undefined) {
                            setMaxAttempts(data.maxAttempts);
                            setAttemptsLeft(prev => Math.min(prev, data.maxAttempts));
                        }
                        if (data.blindMode !== undefined) setBlindMode(data.blindMode);
                        if (data.gameStopped !== undefined) setGameStopped(data.gameStopped);
                        if (data.showPlayerLeaderboard !== undefined) setShowPlayerLeaderboard(data.showPlayerLeaderboard);
                    }
                });

                const scoresRef = db.ref('leaderboard');
                scoresRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const loaded = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                        loaded.sort((a, b) => a.diff - b.diff);
                        setLeaderboard(loaded);
                    } else {
                        setLeaderboard([]);
                    }
                });

                return () => {
                    settingsRef.off();
                    scoresRef.off();
                };
            }, []);

            // Таймер
            React.useEffect(() => {
                let interval;
                if (timerState === 'running') {
                    interval = setInterval(() => {
                        setElapsed((performance.now() - startTime) / 1000);
                    }, 16);
                }
                return () => clearInterval(interval);
            }, [timerState, startTime]);

            const handleStartTimer = () => {
                if (attemptsLeft <= 0 || gameStopped) return;
                setStartTime(performance.now());
                setElapsed(0);
                setTimerState('running');
            };

            const handleStopTimer = () => {
                if (timerState !== 'running') return;
                const finalTime = (performance.now() - startTime) / 1000;
                setTimerState('stopped');
                setElapsed(finalTime);
                const newAttemptsLeft = attemptsLeft - 1;
                setAttemptsLeft(newAttemptsLeft);

                const diff = Math.abs(finalTime - targetTime);
                const currentAttempt = { time: finalTime, diff: diff };

                const updatedMyResults = [...myResults, currentAttempt];
                setMyResults(updatedMyResults);

                const bestAttempt = updatedMyResults.reduce((best, curr) => curr.diff < best.diff ? curr : best, currentAttempt);

                const sanitizedName = playerName.trim() || 'Аноним';
                const playerKey = sanitizedName.replace(/[.#$[\]]/g, '_');
                
                db.ref('leaderboard/' + playerKey).set({
                    name: sanitizedName,
                    time: bestAttempt.time,
                    diff: bestAttempt.diff,
                    timestamp: Date.now()
                });
            };

            const updateSetting = (key, val) => {
                db.ref('settings/' + key).set(val);
            };

            return React.createElement('div', { className: 'min-h-screen p-4 flex flex-col items-center justify-start max-w-md mx-auto pt-6' }, [
                // Шапка
                React.createElement('div', { key: 'header', className: 'w-full flex justify-between items-center mb-6 bg-slate-800 p-3 rounded-2xl shadow-lg border border-slate-700' }, [
                    React.createElement('button', { 
                        onClick: handleLogoClick,
                        className: 'font-extrabold text-indigo-400 text-sm hover:opacity-80 transition active:scale-95 text-left' 
                    }, '⏱️ СТОП 5 СЕК'),
                    React.createElement('div', { className: 'flex gap-1.5' }, [
                        React.createElement('button', {
                            onClick: () => setView('player'),
                            className: `px-3 py-1.5 rounded-xl text-xs font-bold transition ${view === 'player' ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-slate-300'}`
                        }, 'Игрок'),
                        React.createElement('button', {
                            onClick: () => setView('bigScreen'),
                            className: `px-3 py-1.5 rounded-xl text-xs font-bold transition ${view === 'bigScreen' ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-slate-300'}`
                        }, 'Экран')
                    ])
                ]),

                // Экран Игрока
                view === 'player' && React.createElement('div', { key: 'player-view', className: 'w-full flex flex-col items-center' }, [
                    !isRegistered ? React.createElement('div', { key: 'reg', className: 'w-full bg-slate-800 p-6 rounded-3xl shadow-xl text-center border border-slate-700 mt-4' }, [
                        React.createElement('h2', { className: 'text-2xl font-black mb-2 text-white' }, 'Вход в игру'),
                        React.createElement('p', { className: 'text-slate-400 text-sm mb-6' }, `Нажми ровно на ${targetTime} секундах!`),
                        React.createElement('input', {
                            type: 'text',
                            placeholder: 'Введите ваше имя',
                            value: playerName,
                            onChange: e => setPlayerName(e.target.value),
                            className: 'w-full p-4 bg-slate-900 border border-slate-700 rounded-2xl mb-4 text-center text-white font-bold text-lg focus:outline-none focus:border-indigo-500'
                        }),
                        React.createElement('button', {
                            onClick: () => {
                                const name = playerName.trim();
                                if (!name) return alert('Пожалуйста, введите имя!');
                                localStorage.setItem('stop_game_name', name);
                                setIsRegistered(true);
                            },
                            className: 'w-full py-4 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-black rounded-2xl shadow-lg transition text-lg'
                        }, 'Погнали!')
                    ]) : React.createElement('div', { key: 'game', className: 'w-full flex flex-col items-center' }, [
                        React.createElement('div', { className: 'mb-4 text-slate-400 text-sm font-semibold flex justify-between w-full px-2' }, [
                            React.createElement('span', {}, ['Игрок: ', React.createElement('span', { className: 'text-indigo-400 font-bold' }, playerName)]),
                            React.createElement('button', { 
                                onClick: () => { localStorage.removeItem('stop_game_name'); setIsRegistered(false); },
                                className: 'text-xs text-slate-500 underline' 
                            }, 'сменить имя')
                        ]),

                        // Статус Стоп-Игры
                        gameStopped && React.createElement('div', { className: 'w-full bg-amber-500/20 border border-amber-500/50 text-amber-300 p-3 rounded-2xl text-center text-xs font-bold mb-4 animate-pulse' }, '⏹️ ИГРА ОСТАНОВЛЕНА ВЕДУЩИМ'),
                        
                        React.createElement('div', { className: 'w-full bg-slate-800 p-6 rounded-3xl shadow-2xl text-center mb-8 border border-slate-700' }, [
                            React.createElement('div', { className: 'text-5xl font-black mb-2 font-mono text-indigo-400 tracking-wider' },
                                blindMode && timerState === 'running' ? '?.???' : elapsed.toFixed(3) + 'с'
                            ),
                            React.createElement('div', { className: 'text-xs font-semibold text-slate-400 uppercase tracking-widest' }, `Цель: ${targetTime.toFixed(3)} сек`)
                        ]),

                        timerState === 'running' ? React.createElement('button', {
                            onClick: handleStopTimer,
                            className: 'w-52 h-52 rounded-full bg-rose-600 hover:bg-rose-500 active:scale-90 text-white font-black text-3xl shadow-2xl shadow-rose-900/60 transition transform flex items-center justify-center mb-6 border-8 border-rose-400/30'
                        }, 'СТОП!') : React.createElement('button', {
                            onClick: handleStartTimer,
                            disabled: attemptsLeft <= 0 || gameStopped,
                            className: `w-52 h-52 rounded-full font-black text-3xl shadow-2xl transition transform flex items-center justify-center mb-6 border-8 ${attemptsLeft > 0 && !gameStopped ? 'bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white border-emerald-400/30 shadow-emerald-900/60' : 'bg-slate-800 text-slate-600 border-slate-700 cursor-not-allowed'}`
                        }, gameStopped ? 'СТОП' : (attemptsLeft > 0 ? 'СТАРТ' : 'ФИНИШ')),

                        React.createElement('div', { className: 'text-xs font-bold text-slate-400 mb-6 bg-slate-800/80 px-4 py-2 rounded-full border border-slate-700' }, `Осталось попыток: ${attemptsLeft} из ${maxAttempts}`),

                        // Личная история
                        React.createElement('div', { className: 'w-full bg-slate-800/60 p-4 rounded-3xl border border-slate-700/50 mb-4' }, [
                            React.createElement('h3', { className: 'font-bold mb-3 text-xs text-slate-400 uppercase tracking-wider' }, 'Ваши попытки'),
                            myResults.length === 0 ? React.createElement('div', { className: 'text-xs text-slate-500 text-center py-2' }, 'Нажмите СТАРТ') :
                            React.createElement('div', { className: 'space-y-2' }, myResults.map((r, idx) => 
                                React.createElement('div', { key: idx, className: 'flex justify-between items-center bg-slate-800 p-3 rounded-2xl text-xs border border-slate-700' }, [
                                    React.createElement('span', { className: 'font-bold text-slate-200' }, `#${idx + 1} попытка`),
                                    React.createElement('span', { className: 'font-mono font-bold text-indigo-400' }, `${r.time.toFixed(3)}с (±${r.diff.toFixed(3)})`)
                                ])
                            ))
                        ]),

                        // Общая таблица или сообщение об интриге
                        React.createElement('div', { className: 'w-full bg-slate-800/60 p-4 rounded-3xl border border-slate-700/50' }, [
                            React.createElement('h3', { className: 'font-bold mb-3 text-xs text-slate-400 uppercase tracking-wider' }, 'Общий рейтинг'),
                            !showPlayerLeaderboard ? React.createElement('div', { className: 'text-xs text-indigo-300 text-center py-4 bg-indigo-950/40 rounded-2xl border border-indigo-500/30 font-semibold' }, '🔒 Результаты скрыты ведущим.\nЖдите подведения итогов на экране!') :
                            (leaderboard.length === 0 ? React.createElement('div', { className: 'text-xs text-slate-500 text-center py-2' }, 'Таблица пуста') :
                            React.createElement('div', { className: 'space-y-2' }, leaderboard.map((r, idx) => 
                                React.createElement('div', { key: r.id, className: `flex justify-between items-center p-2.5 rounded-2xl text-xs ${r.name === playerName ? 'bg-indigo-600/30 border border-indigo-500' : 'bg-slate-800 border border-slate-700'}` }, [
                                    React.createElement('span', { className: 'font-bold text-slate-200' }, `${idx + 1}. ${r.name}`),
                                    React.createElement('span', { className: 'font-mono text-indigo-400 font-bold' }, `${r.time.toFixed(3)}с`)
                                ])
                            )))
                        ])
                    ])
                ]),

                // Панель Админа
                view === 'admin' && React.createElement('div', { key: 'admin-view', className: 'w-full bg-slate-800 p-6 rounded-3xl shadow-xl border border-slate-700' }, [
                    React.createElement('div', { className: 'flex justify-between items-center mb-4' }, [
                        React.createElement('h2', { className: 'text-xl font-black text-indigo-400' }, '⚙️ Настройки игры'),
                        React.createElement('button', { onClick: () => setView('player'), className: 'text-xs bg-slate-700 px-3 py-1.5 rounded-xl text-slate-300' }, 'Закрыть')
                    ]),
                    
                    React.createElement('div', { className: 'space-y-4' }, [
                        // Кнопка Стоп Игра
                        React.createElement('button', {
                            onClick: () => updateSetting('gameStopped', !gameStopped),
                            className: `w-full py-3.5 font-black rounded-2xl transition text-sm flex items-center justify-center gap-2 border ${gameStopped ? 'bg-emerald-600 hover:bg-emerald-500 text-white border-emerald-400' : 'bg-rose-600 hover:bg-rose-500 text-white border-rose-400'}`
                        }, gameStopped ? '▶️ ВОЗОБНОВИТЬ ПРИЕМ ПОПЫТОК' : '⏹️ СТОП ИГРА (Заблокировать)'),

                        // Показать/Скрыть рейтинг у игроков
                        React.createElement('div', { className: 'flex items-center justify-between bg-slate-900 p-3.5 rounded-xl border border-slate-700' }, [
                            React.createElement('span', { className: 'text-xs font-bold text-slate-300' }, 'Показывать рейтинг игрокам:'),
                            React.createElement('input', {
                                type: 'checkbox',
                                checked: showPlayerLeaderboard,
                                onChange: e => updateSetting('showPlayerLeaderboard', e.target.checked),
                                className: 'w-5 h-5 accent-indigo-600'
                            })
                        ]),

                        React.createElement('div', {}, [
                            React.createElement('label', { className: 'block text-xs font-bold text-slate-400 mb-1.5' }, 'Целевое время (сек):'),
                            React.createElement('input', {
                                type: 'number',
                                step: '0.1',
                                value: targetTime,
                                onChange: e => updateSetting('targetTime', parseFloat(e.target.value) || 5.0),
                                className: 'w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white font-bold'
                            })
                        ]),
                        React.createElement('div', {}, [
                            React.createElement('label', { className: 'block text-xs font-bold text-slate-400 mb-1.5' }, 'Количество попыток:'),
                            React.createElement('input', {
                                type: 'number',
                                value: maxAttempts,
                                onChange: e => {
                                    const val = parseInt(e.target.value) || 1;
                                    updateSetting('maxAttempts', val);
                                    setAttemptsLeft(val);
                                },
                                className: 'w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white font-bold'
                            })
                        ]),
                        React.createElement('div', { className: 'flex items-center justify-between bg-slate-900 p-3.5 rounded-xl border border-slate-700' }, [
                            React.createElement('span', { className: 'text-xs font-bold text-slate-300' }, 'Слепой режим (скрывать цифры):'),
                            React.createElement('input', {
                                type: 'checkbox',
                                checked: blindMode,
                                onChange: e => updateSetting('blindMode', e.target.checked),
                                className: 'w-5 h-5 accent-indigo-600'
                            })
                        ]),
                        React.createElement('div', { className: 'pt-2 flex flex-col items-center' }, [
                            React.createElement('label', { className: 'block text-xs font-bold text-slate-400 mb-2' }, 'QR-код для подключения:'),
                            React.createElement(ReliableQRCode, { value: currentAppUrl, size: 160 })
                        ]),
                        React.createElement('button', {
                            onClick: () => { 
                                if (confirm('Точно очистить общую таблицу лидеров?')) {
                                    db.ref('leaderboard').remove();
                                    alert('Таблица очищена!');
                                }
                            },
                            className: 'w-full py-3 bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 border border-rose-600/40 font-bold rounded-xl transition text-sm'
                        }, 'Очистить всю таблицу лидеров')
                    ])
                ]),

                // Экран Проектора
                view === 'bigScreen' && React.createElement('div', { key: 'big-screen', className: 'w-full flex flex-col items-center' }, [
                    React.createElement('h2', { className: 'text-2xl font-black mb-1 text-indigo-400 text-center tracking-tight' }, '🏆 ОБЩАЯ ТАБЛИЦА ЛИДЕРОВ'),
                    React.createElement('p', { className: 'text-xs font-bold text-slate-400 mb-6 text-center uppercase tracking-widest' }, `Цель: ${targetTime.toFixed(3)} сек`),
                    
                    React.createElement('div', { className: 'w-full bg-slate-800 p-4 rounded-3xl shadow-xl mb-6 border border-slate-700' }, [
                        leaderboard.length === 0 ? React.createElement('div', { className: 'text-center py-10 text-slate-500 font-bold text-sm' }, 'Ожидание участников...') :
                        React.createElement('div', { className: 'space-y-2.5' }, leaderboard.map((r, idx) => 
                            React.createElement('div', { key: r.id, className: `flex justify-between items-center p-3.5 rounded-2xl border ${idx === 0 ? 'bg-amber-500/20 border-amber-500/50 text-amber-300' : 'bg-slate-900 border-slate-700/60 text-slate-200'}` }, [
                                React.createElement('div', { className: 'flex items-center gap-3' }, [
                                    React.createElement('span', { className: 'font-black text-base' }, `#${idx + 1}`),
                                    React.createElement('span', { className: 'font-bold text-sm' }, r.name)
                                ]),
                                React.createElement('div', { className: 'text-right font-mono' }, [
                                    React.createElement('div', { className: 'font-extrabold text-base text-indigo-400' }, `${r.time.toFixed(3)}с`),
                                    React.createElement('div', { className: 'text-[10px] opacity-75 text-slate-400' }, `±${r.diff.toFixed(3)}с`)
                                ])
                            ])
                        ))
                    ]),

                    React.createElement('div', { className: 'flex flex-col items-center bg-slate-800 p-4 rounded-3xl border border-slate-700 shadow-xl' }, [
                        ReliableQRCode({ value: currentAppUrl, size: 140 }),
                        React.createElement('span', { className: 'text-indigo-300 font-bold text-xs mt-3' }, 'Сканируй, чтобы играть!')
                    ])
                ])
            ]);
        }

        ReactDOM.render(React.createElement(App), document.getElementById('root'));
    </script>
</body>
</html>
